# Model manifest (PLAN §15). Downloaded to ~/.cache/liveinterpreter/models/ on
# first use and verified by sha256; installers ship none of these; the
# 2 MB VAD is embedded in the binary instead. Sizes and hashes are filled in by task 1.13.

[[model]]
id = "zipformer-en-streaming"
kind = "asr-fast"
note = "sherpa-onnx streaming Zipformer, LibriSpeech+GigaSpeech. Do NOT substitute the LibriSpeech-only build: 95% WER on a real meeting (task 1.0a)."

[[model]]
id = "whisper-small-en-q5_1"
kind = "asr-accurate"
note = "GGML. Locked by task 1.0b/1.0c: RTF 0.053-0.063 on Vulkan, 2.1x streaming headroom. medium is rejected -- it cannot keep up and is not reliably more accurate."

[[model]]
id = "whisper-base-en-q5_1"
kind = "asr-accurate-degraded"
note = "No-GPU fallback, locked by task 1.4: full 30s encoder context on CPU keeps up (work factor 0.571) with a 0.0% drop rate. Do NOT instead run small.en with a shortened audio_ctx to buy the speed -- it makes whisper repeat whole clauses (content WER 15.2% -> 36.1%). Still needs li-stream to hold the mean buffer <= 6s."

[[model]]
id = "silero-vad"
kind = "vad"
sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"
note = "silero-vad v5 (MIT). Not downloaded: 2.2 MB, embedded in li-vad with include_bytes! from assets/models/. See assets/models/README.md."

[[model]]
id = "nllb-200-distilled-600m-ct2-int8"
kind = "mt"
note = """CTranslate2 int8, from JustFrederik/nllb-200-distilled-600M-ct2-int8. Needs model.bin \
and tokenizer.json; the .safetensors/sentencepiece files in that repo are not used. Locked by \
task 1.6: beam 4, source cut into clauses of >6 words, final full stop dropped. Do NOT hand it a \
whole multi-clause line -- it translates one clause and silently drops the rest (33% of lines). \
It also cannot use context: given the previous sentence it translates *that* instead. \
CC-BY-NC -- must be replaced before any public or commercial release."""

[[model]]
id = "online-punct-en-2024-08-06"
kind = "punct"
sha256 = "9f5e5a72c7d2829635bd074fce92b6bbd5b78da8a52e7ad8ed1be933f366b99d"
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/sherpa-onnx-online-punct-en-2024-08-06.tar.bz2"
note = """CNN-BiLSTM (Edge-Punct-Casing), English. Punctuation AND casing for the fast lane, which \
emits neither. model.int8.onnx is 7.5 MB; the 29 MB float model buys nothing a subtitle can see. \
Unpacks to sherpa-onnx-<id>/, the same convention as the fast lane. Task 1.25: p90 4.9-8.6 ms a \
call, and on the user's own transcripts it recovers 48 of 83 swallowed sentence boundaries at \
0.84 precision. OPTIONAL -- missing means punct: None and today's behaviour exactly, unlike the \
two ASR lanes, which fail startup. Feed it LOWER CASE: sherpa's DecodeSentences only ever calls \
toupper, so all-caps in is all-caps out."""
