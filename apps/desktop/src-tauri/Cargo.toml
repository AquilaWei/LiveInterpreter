[package]
name = "li-desktop"
description = "The floating subtitle bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "liveinterpreter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
li-core = { workspace = true }
li-audio = { workspace = true }
li-types = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["devtools"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-global-shortcut = "2.3.2"
# The file picker for 語音轉檔. GTK 3, which inside a Flatpak goes through the
# file-chooser portal, so the sandbox needs no filesystem permission for it.
tauri-plugin-dialog = "2.7.3"

[features]
default = ["gpu-vulkan", "mt-dnnl"]
gpu-vulkan = ["li-core/gpu-vulkan"]
gpu-cuda = ["li-core/gpu-cuda"]
gpu-sycl = ["li-core/gpu-sycl"]
mt-dnnl = ["li-core/mt-dnnl"]

[lints]
workspace = true
