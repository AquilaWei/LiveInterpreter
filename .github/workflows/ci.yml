name: ci
on:
  push: { branches: [main, master] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What this job checks is the logic, not the build that ships. Three
      # things a real build needs are left out on purpose:
      #
      # - `--no-default-features` drops the apps' `gpu-vulkan` and `mt-dnnl`.
      #   Vulkan needs SPIRV-Headers, which no distro packages,
      #   and CI has no GPU to run it on anyway -- `li-asr::device` is written
      #   so the selection policy is testable without one. oneDNN is a long
      #   from-source build with its own lib64 wart that
      #   `scripts/build.sh` handles and plain cargo does not.
      # - No models. They are 1 GB and downloaded at runtime; every test that
      #   needs them prints SKIP and passes. The shipped build is checked on a
      #   real machine, and inside a clean container by
      #   `scripts/flatpak-test.sh`.
      #
      # cpal's Linux host links ALSA; the Pulse backend links libpulse.so.0
      # directly and needs no -dev package. whisper.cpp and CTranslate2 build
      # from source, hence cmake and g++ (both on ubuntu-latest, listed so a
      # runner image change fails loudly). whisper-rs generates its bindings
      # with bindgen, which needs libclang. webkit2gtk and GTK 3 are for the
      # desktop app, which Tauri 2 builds on.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev cmake g++ libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # sherpa-rs-sys downloads its prebuilt libraries to ~/.cache/sherpa-rs,
      # outside target/. Caching target/ alone restores a build script that
      # will not rerun, pointing at libraries the fresh runner does not have,
      # and every test binary fails to link. The prefix went to v1 when the
      # directory was added, so no cache saved without it is restored.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: ~/.cache/sherpa-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # The build script also copies the .so files next to the test binaries
      # in target/debug, but rust-cache prunes them from what it saves, and a
      # build script that does not rerun does not copy them back. The test
      # binaries then link and fail to start. Load them from the cache itself,
      # which clippy above has filled either way.
      - run: >-
          echo "LD_LIBRARY_PATH=$(dirname "$(find ~/.cache/sherpa-rs
          -name libsherpa-onnx-c-api.so -print -quit)")" >> "$GITHUB_ENV"
      - run: cargo test --workspace --no-default-features
      # The bar's own logic (which translations stay on screen) is plain
      # JavaScript with no window in it, so node checks it directly. Node is
      # on ubuntu-latest; nothing is installed for it.
      - run: node --test apps/desktop/ui/*.test.mjs

  # Windows is on hold, and this job has never run on a real
  # Windows runner. Commented out rather than deleted so it comes back
  # as written when Windows does.
  #
  # The Windows capture path. This machine has no Windows, so the WASAPI
  # path was written against cpal's source and checked by cross-compiling
  # (`cargo check --target x86_64-pc-windows-msvc`); a runner that is actually
  # Windows is the next step up from that, and the first place `cargo test`
  # runs the loopback code's own tests on the platform it is for.
  #
  # Scoped to the crates that build from crates.io alone. `li-asr` and `li-mt`
  # compile whisper.cpp, CTranslate2 and oneDNN from source, which is a
  # different job's worth of build time and a set of Windows build warts nobody
  # has met yet -- adding them here before anyone has built them once by hand
  # would be guessing at their failures rather than fixing them.
  # windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         components: clippy
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo clippy -p li-types -p li-audio -p li-stream -p li-transcript --all-targets -- -D warnings
  #     - run: cargo test -p li-types -p li-audio -p li-stream -p li-transcript
