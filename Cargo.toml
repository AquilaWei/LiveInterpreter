[workspace]
resolver = "3"
# `apps/desktop` is named rather than globbed: its manifest lives in
# `src-tauri/`, which is the layout every Tauri tool expects.
members = ["apps/cli", "apps/desktop/src-tauri", "crates/*", "xtask"]

[workspace.package]
version = "1.3.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/AquilaWei/LiveInterpreter"

[workspace.dependencies]
li-types = { path = "crates/li-types" }
li-audio = { path = "crates/li-audio" }
li-vad = { path = "crates/li-vad" }
li-asr = { path = "crates/li-asr" }
li-mt = { path = "crates/li-mt" }
li-stream = { path = "crates/li-stream" }
li-transcript = { path = "crates/li-transcript" }
li-core = { path = "crates/li-core" }

anyhow = "1"
cpal = "0.16"
hound = "3"
# Decoding for file transcription: mp3, m4a/AAC, flac, ogg/vorbis and wav in
# pure Rust, so neither the Flatpak nor the rpm has to carry ffmpeg.
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd", "aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav",
] }
# ONNX Runtime for Silero VAD. rustls rather than the default native-tls:
# the download is a build-time fetch of the runtime, and making every
# build machine carry OpenSSL headers for it is not a trade worth making.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-rustls",
    "copy-dylibs", "api-27",
] }
# Fast lane. sherpa-rs (the safe wrapper) only binds sherpa-onnx's *offline*
# recognizer -- its online API is used for keyword spotting and speaker id, not
# ASR -- so the streaming lane has to go through the -sys crate. See
# `crates/li-asr/src/sherpa.rs`. `download-binaries` fetches a prebuilt
# sherpa-onnx, which is why no C++ toolchain is needed for this half.
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
# Accurate lane. Builds whisper.cpp from source (cmake + a C++ compiler).
# GPU backends are opt-in features, never default: a Vulkan build needs
# SPIRV-Headers, which Fedora has no package for.
whisper-rs = { version = "0.16", default-features = false, features = ["tracing_backend"] }
# The GPU features and the device enumeration both go through -sys rather than
# through whisper-rs. whisper-rs 0.16's `vulkan` feature does not compile: its
# device-listing module still imports `ggml_backend_vk_*`, which ggml replaced
# with a generic backend-device registry. Version pinned exactly to the one
# whisper-rs 0.16 depends on, so cargo builds whisper.cpp once, not twice.
whisper-rs-sys = { version = "=0.15.0", default-features = false }
# MT. Vendors CTranslate2 and builds it with cmake, so there is no system
# CTranslate2 to install -- the same trade whisper-rs makes. `sentencepiece`, in
# the default feature set, is dropped: it is a C++ binding to a tokenizer this
# workspace does not use, because NLLB ships a `tokenizer.json`.
#
# `ruy` is not optional. CTranslate2 refuses to load an int8 model unless one of
# ruy / oneDNN / MKL is compiled in ("Requested int8 compute type, but the
# target device or backend do not support efficient int8 computation"), and ruy
# is the one of the three that also covers ARM builds (a future Android port), so the
# desktop and the phone run the same kernels.
ct2rs = { version = "0.10.1", default-features = false, features = ["ruy"] }
# OpenCC s2twp, as a pure-Rust reimplementation with the dictionaries compiled
# into the binary. `opencc-rust`, the obvious alternative, binds the C++
# libopencc and loads .ocd2 files from a system path at run time -- a build-time
# `opencc-devel` on Fedora and a vendored DLL plus a data directory on Windows
# and Android. `crates/li-mt/tests/reference.rs` checks this crate against
# OpenCC 1.1.9's own output on every case in the prototype's fixture.
ferrous-opencc = { version = "0.4", default-features = false, features = ["s2t-conversion"] }
# NLLB's tokenizer.json, read directly. Default features add oniguruma (C) and
# esaxx (C++) for a regex pre-tokenizer and a trainer this crate never uses, so
# the pure-Rust `fancy-regex` stands in -- one of the two is mandatory even
# though NLLB's own pipeline (Precompiled + Metaspace + BPE) never reaches it.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# Local wall-clock time for the session filename (`2026-08-31_193045_en.txt`).
# std has no calendar, and the two obvious crates both stumble here: `time`
# refuses to read the local UTC offset from a multi-threaded process
# (`IndeterminateOffset`), which this one is, and `chrono` carries a tzdb story
# per platform. jiff reads /usr/share/zoneinfo on Linux, bundles a tzdb for
# Windows, and reads Android's concatenated tzdata -- the three platforms this is meant for.
jiff = "0.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
toml = "0.9"
# The settings window writes the same file a person edits by hand, so the
# writer edits the document rather than serialising over it (see `save_to`).
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The model downloader. All four were already in the lock file as
# transitive dependencies -- reqwest through tauri, the other three as build
# dependencies of sherpa-rs-sys and tauri-codegen -- so naming them here adds
# no new third-party code and no extra compilation. rustls rather than
# native-tls for the same reason `ort` picks it above: no OpenSSL headers on
# the build machine. `stream` is what lets the progress bar move during a
# 613 MB file rather than after it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
# Only the punctuation model is an archive; see assets/models.toml.
tar = "0.4"
bzip2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
