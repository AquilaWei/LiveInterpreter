[package]
name = "li-asr"
description = "Pluggable ASR backends, fast and accurate lane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Both lanes on by default: a build with no recogniser in it is not a build of
# this program. The GPU backends are the opposite -- opt in, because each one
# adds a build-time dependency the plain build does not need.
default = ["sherpa", "whispercpp"]
sherpa = ["dep:sherpa-rs-sys"]
whispercpp = ["dep:whisper-rs", "dep:whisper-rs-sys"]
# Routed through -sys, not through whisper-rs: see the note in the workspace
# manifest. Each of these makes whisper.cpp's cmake build pull in that backend,
# so each adds build-time dependencies -- Vulkan needs SPIRV-Headers and glslc,
# which is why none of them is on by default.
gpu-vulkan = ["whisper-rs-sys?/vulkan"]
gpu-cuda = ["whisper-rs-sys?/cuda"]
gpu-sycl = ["whisper-rs-sys?/intel-sycl"]
gpu-hipblas = ["whisper-rs-sys?/hipblas"]

[dependencies]
li-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sherpa-rs-sys = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }
whisper-rs-sys = { workspace = true, optional = true }

[dev-dependencies]
# The bench example only. `li-audio` gives it a file source that paces at
# playback speed and does not slow down for a slow consumer, and `li-vad` gives
# the accurate lane the pause detector it needs before it can be measured at
# all. Neither is a dependency of the library.
li-audio = { workspace = true }
li-vad = { workspace = true }
hound = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
