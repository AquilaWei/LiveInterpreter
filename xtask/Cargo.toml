[package]
name = "xtask"
description = "Build and evaluation tasks (PLAN §16)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
li-asr = { workspace = true }
li-audio = { workspace = true }
li-mt = { workspace = true }
li-transcript = { workspace = true }
li-stream = { workspace = true }
li-types = { workspace = true }
li-vad = { workspace = true }
# `xtask punct --text` reads the program's own .jsonl transcripts, so the
# target domain needs no new recording.
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Passed through so `cargo xtask eval` can measure the accurate lane on the GPU
# it will actually ship on. Never on by default: a Vulkan build needs
# SPIRV-Headers, which Fedora has no package for (task 1.0b).
# Passed through so `xtask mt` can measure the MT backend both ways.
mt-dnnl = ["li-mt/dnnl"]
gpu-vulkan = ["li-asr/gpu-vulkan"]
gpu-cuda = ["li-asr/gpu-cuda"]
gpu-sycl = ["li-asr/gpu-sycl"]
gpu-hipblas = ["li-asr/gpu-hipblas"]

[lints]
workspace = true
